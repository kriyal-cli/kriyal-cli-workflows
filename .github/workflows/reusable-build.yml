name: Reusable Build Pipeline

# Generic, product-agnostic build/test/lint/release pipeline for Rust
# workspaces spread across multiple sibling repos. Callers configure
# everything through inputs/secrets below - this file has no knowledge
# of any specific product, crate, or organization.
#
# Any product-specific gates (security scanning, policy enforcement,
# custom test suites, etc.) belong in a separate private workflow that
# your calling workflow chains after this one via `needs:` - keeping
# this file generic means it changes rarely and stays safe to keep
# public.

on:
  workflow_call:
    inputs:
      checkout-repo:
        description: 'owner/repo to check out as the base workspace'
        required: true
        type: string
      checkout-ref:
        description: 'Ref to check out for checkout-repo (defaults to its default branch)'
        required: false
        type: string
        default: ''
      checkout-path:
        description: 'Subdirectory (relative to the job workspace root) to check out checkout-repo into. Leave as "." for a workspace with no external path-dependencies (checkout goes to the workspace root, same as before). Set this when checkout-repo has crates that path-depend on sibling repos outside itself (e.g. "../../../other-repo/crates/x") - clone-repos entries then land as TRUE siblings of this directory, matching what those path-deps expect.'
        required: false
        type: string
        default: '.'
      clone-repos:
        description: 'Space-separated "owner/repo:localdir" pairs to shallow-clone as siblings of checkout-path (all cloned with the same checkout-token)'
        required: false
        type: string
        default: ''
      target-crates:
        description: 'Space-separated crate names to check/build/test'
        required: true
        type: string
      target-name:
        description: 'Human-readable name for this build target, used in job summaries and artifact names'
        required: true
        type: string
      run-tests:
        required: false
        type: boolean
        default: true
      build-release:
        required: false
        type: boolean
        default: false
      check-wasm:
        description: 'Check WASM target compilation'
        required: false
        type: boolean
        default: false
      release-binaries:
        description: 'Space-separated crate names to build release binaries for (defaults to target-crates)'
        required: false
        type: string
        default: ''
      run-security:
        description: 'Run generic dependency security scanning (cargo-deny licenses/bans/advisories + cargo-audit) - no product-specific crate names involved'
        required: false
        type: boolean
        default: true
      security-audit-ignore:
        description: 'Space-separated RUSTSEC advisory IDs to ignore in cargo-audit (e.g. RUSTSEC-2020-0071)'
        required: false
        type: string
        default: ''
      deny-toml-ref:
        description: 'Ref of kriyal-cli/kriyal-cli-workflows to fetch the shared default deny.toml from, used only when checkout-repo has no deny.toml of its own'
        required: false
        type: string
        default: 'v1'
      run-linux:
        description: 'Run a native Linux build+test job on ubuntu-latest (a GitHub-hosted runner, no self-hosted dependency). Runs independently/in parallel with macos and windows, so it reports back fastest - a practical way to prioritize Linux feedback without a fake sequential gate (GitHub Actions needs: graphs are static per file, so true per-caller reordering of macos/windows priority isn`t supported here).'
        required: false
        type: boolean
        default: false
      use-self-hosted-macos:
        description: 'Run the macOS job on a self-hosted runner instead of macos-latest'
        required: false
        type: boolean
        default: false
      concurrency-group:
        description: 'Concurrency group name - set the same value across callers that share a single-machine runner to serialize their builds'
        required: false
        type: string
        default: ''
    secrets:
      CHECKOUT_TOKEN:
        description: 'Token with read access to checkout-repo and every repo listed in clone-repos'
        required: true

concurrency:
  group: ${{ inputs.concurrency-group != '' && inputs.concurrency-group || format('reusable-build-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ══════════════════════════════════════════════════════════════════
  # PLATFORM PIPELINE — macOS first, Windows gated behind it.
  #
  # PR label escape hatch: a PR clearly scoped to one platform doesn't
  # need the other platform to run at all. Attach the label in the PR's
  # Labels sidebar - these are read from PR metadata, NOT the PR body
  # or commit message.
  #   - label `ci:windows-only` → skip macOS entirely, run Windows only
  #   - label `ci:macos-only`   → run macOS only, skip Windows
  #   - label `ci:all`          → force every platform regardless of
  #     any other ci:*-only label present
  # (No label, or ci:windows-only + ci:macos-only together, runs the
  # normal macOS→Windows chain.)
  # ══════════════════════════════════════════════════════════════════

  linux:
    name: 'linux (build + test)'
    if: inputs.run-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { repository: '${{ inputs.checkout-repo }}', ref: '${{ inputs.checkout-ref }}', token: '${{ secrets.CHECKOUT_TOKEN }}', path: '${{ inputs.checkout-path }}' }
      - name: Clone workspace repos
        if: inputs.clone-repos != ''
        shell: bash
        run: |
          TOKEN=${{ secrets.CHECKOUT_TOKEN }}
          for rd in ${{ inputs.clone-repos }}; do
            r="${rd%%:*}"; d="${rd##*:}"
            [ ! -d "$d" ] && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${r}.git" "$d" || echo "WARN: failed to clone ${r} into ${d}"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: platform-linux, workspaces: '${{ inputs.checkout-path }}' }
      - name: Cargo check
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo check $CRATE_FLAGS
      - name: Cargo test
        if: inputs.run-tests
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo test $CRATE_FLAGS --lib
          cargo test $CRATE_FLAGS --tests

  macos:
    name: 'macos (build + test)'
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:windows-only') || contains(github.event.pull_request.labels.*.name, 'ci:all') }}
    runs-on: ${{ inputs.use-self-hosted-macos && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
        with: { repository: '${{ inputs.checkout-repo }}', ref: '${{ inputs.checkout-ref }}', token: '${{ secrets.CHECKOUT_TOKEN }}', path: '${{ inputs.checkout-path }}' }
      - name: Clone workspace repos
        if: inputs.clone-repos != ''
        shell: bash
        run: |
          TOKEN=${{ secrets.CHECKOUT_TOKEN }}
          for rd in ${{ inputs.clone-repos }}; do
            r="${rd%%:*}"; d="${rd##*:}"
            [ ! -d "$d" ] && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${r}.git" "$d" || echo "WARN: failed to clone ${r} into ${d}"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: platform-macos, workspaces: '${{ inputs.checkout-path }}' }
      - name: Cargo check
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo check $CRATE_FLAGS
      - name: Cargo test
        if: inputs.run-tests
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo test $CRATE_FLAGS --lib
          cargo test $CRATE_FLAGS --tests

  windows:
    name: 'windows (build + test)'
    needs: [macos]
    if: ${{ always() && needs.macos.result != 'failure' && (!contains(github.event.pull_request.labels.*.name, 'ci:macos-only') || contains(github.event.pull_request.labels.*.name, 'ci:all')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { repository: '${{ inputs.checkout-repo }}', ref: '${{ inputs.checkout-ref }}', token: '${{ secrets.CHECKOUT_TOKEN }}', path: '${{ inputs.checkout-path }}' }
      - name: Clone workspace repos
        if: inputs.clone-repos != ''
        shell: bash
        run: |
          TOKEN=${{ secrets.CHECKOUT_TOKEN }}
          for rd in ${{ inputs.clone-repos }}; do
            r="${rd%%:*}"; d="${rd##*:}"
            [ ! -d "$d" ] && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${r}.git" "$d" || echo "WARN: failed to clone ${r} into ${d}"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: platform-windows, workspaces: '${{ inputs.checkout-path }}' }
      - name: Cargo check
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo check $CRATE_FLAGS
      - name: Cargo test
        if: inputs.run-tests
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo test $CRATE_FLAGS --lib
          cargo test $CRATE_FLAGS --tests

  check-wasm:
    if: inputs.check-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { repository: '${{ inputs.checkout-repo }}', ref: '${{ inputs.checkout-ref }}', token: '${{ secrets.CHECKOUT_TOKEN }}', path: '${{ inputs.checkout-path }}' }
      - name: Clone workspace repos
        if: inputs.clone-repos != ''
        run: |
          TOKEN=${{ secrets.CHECKOUT_TOKEN }}
          for rd in ${{ inputs.clone-repos }}; do
            r="${rd%%:*}"; d="${rd##*:}"
            [ ! -d "$d" ] && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${r}.git" "$d" || echo "WARN: failed to clone ${r} into ${d}"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli
      - uses: Swatinem/rust-cache@v2
        with: { prefix-key: 'rust-wasm', workspaces: '${{ inputs.checkout-path }}' }
      - name: Check wasm target
        working-directory: ${{ inputs.checkout-path }}
        run: for c in ${{ inputs.target-crates }}; do cargo check -p "$c" --target wasm32-unknown-unknown; done

  # ══════════════════════════════════════════════════════════════════
  # LINT — gated on the full platform chain, consistent with not
  # spending compute on anything beyond a commit that hasn't proven it
  # builds+tests yet.
  # ══════════════════════════════════════════════════════════════════
  lint:
    needs: [windows]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { repository: '${{ inputs.checkout-repo }}', ref: '${{ inputs.checkout-ref }}', token: '${{ secrets.CHECKOUT_TOKEN }}', path: '${{ inputs.checkout-path }}' }
      - name: Clone workspace repos
        if: inputs.clone-repos != ''
        run: |
          TOKEN=${{ secrets.CHECKOUT_TOKEN }}
          for rd in ${{ inputs.clone-repos }}; do
            r="${rd%%:*}"; d="${rd##*:}"
            [ ! -d "$d" ] && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${r}.git" "$d" || echo "WARN: failed to clone ${r} into ${d}"
          done
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '${{ inputs.checkout-path }}' }
      - name: Clippy
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo clippy $CRATE_FLAGS -- -W clippy::all
      - name: Fmt check
        working-directory: ${{ inputs.checkout-path }}
        run: cargo fmt --all -- --check

  # ══════════════════════════════════════════════════════════════════
  # SECURITY — generic dependency scanning (license/ban/advisory checks
  # via cargo-deny + cargo-audit). No product-specific crate names here
  # by design - a `cargo deny check` run doesn't need to know what your
  # crates are called, only what they depend on.
  # ══════════════════════════════════════════════════════════════════
  cargo-deny:
    if: inputs.run-security
    needs: [windows]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { repository: '${{ inputs.checkout-repo }}', ref: '${{ inputs.checkout-ref }}', token: '${{ secrets.CHECKOUT_TOKEN }}', path: '${{ inputs.checkout-path }}' }
      - name: Clone workspace repos
        if: inputs.clone-repos != ''
        run: |
          TOKEN=${{ secrets.CHECKOUT_TOKEN }}
          for rd in ${{ inputs.clone-repos }}; do
            r="${rd%%:*}"; d="${rd##*:}"
            [ ! -d "$d" ] && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${r}.git" "$d" || echo "WARN: failed to clone ${r} into ${d}"
          done
      - name: Ensure deny.toml (fetch shared default if repo has none)
        working-directory: ${{ inputs.checkout-path }}
        run: |
          if [ -f deny.toml ]; then
            echo "Using repo-local deny.toml"
          else
            echo "No local deny.toml - fetching shared default (ref: ${{ inputs.deny-toml-ref }})"
            curl -fsSL -o deny.toml "https://raw.githubusercontent.com/kriyal-cli/kriyal-cli-workflows/${{ inputs.deny-toml-ref }}/deny.toml"
          fi
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check licenses
        working-directory: ${{ inputs.checkout-path }}
        run: cargo deny check licenses
      - name: Check advisories (vulnerabilities)
        working-directory: ${{ inputs.checkout-path }}
        run: cargo deny check advisories
      - name: Check bans
        working-directory: ${{ inputs.checkout-path }}
        run: cargo deny check bans

  security-audit:
    if: inputs.run-security
    needs: [windows]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { repository: '${{ inputs.checkout-repo }}', ref: '${{ inputs.checkout-ref }}', token: '${{ secrets.CHECKOUT_TOKEN }}', path: '${{ inputs.checkout-path }}' }
      - name: Clone workspace repos
        if: inputs.clone-repos != ''
        run: |
          TOKEN=${{ secrets.CHECKOUT_TOKEN }}
          for rd in ${{ inputs.clone-repos }}; do
            r="${rd%%:*}"; d="${rd##*:}"
            [ ! -d "$d" ] && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${r}.git" "$d" || echo "WARN: failed to clone ${r} into ${d}"
          done
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Dependency audit
        working-directory: ${{ inputs.checkout-path }}
        run: |
          IGNORE_FLAGS=""
          for id in ${{ inputs.security-audit-ignore }}; do IGNORE_FLAGS="$IGNORE_FLAGS --ignore $id"; done
          cargo audit $IGNORE_FLAGS

  # ══════════════════════════════════════════════════════════════════
  # RELEASE — only if build-release is set
  # ══════════════════════════════════════════════════════════════════
  release-linux:
    if: inputs.build-release
    needs: [windows, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { repository: '${{ inputs.checkout-repo }}', ref: '${{ inputs.checkout-ref }}', token: '${{ secrets.CHECKOUT_TOKEN }}', path: '${{ inputs.checkout-path }}' }
      - name: Clone workspace repos
        if: inputs.clone-repos != ''
        run: |
          TOKEN=${{ secrets.CHECKOUT_TOKEN }}
          for rd in ${{ inputs.clone-repos }}; do
            r="${rd%%:*}"; d="${rd##*:}"
            [ ! -d "$d" ] && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${r}.git" "$d" || echo "WARN: failed to clone ${r} into ${d}"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '${{ inputs.checkout-path }}' }
      - name: Build release binaries
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATES="${{ inputs.release-binaries }}"
          [ -z "$CRATES" ] && CRATES="${{ inputs.target-crates }}"
          for c in $CRATES; do cargo build --release -p "$c"; done
      - uses: actions/upload-artifact@v7
        with: { name: 'linux-x86_64-${{ inputs.target-name }}', path: '${{ inputs.checkout-path }}/target/release/', retention-days: 7 }

  release-macos:
    if: inputs.build-release
    needs: [windows, lint]
    runs-on: ${{ inputs.use-self-hosted-macos && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
        with: { repository: '${{ inputs.checkout-repo }}', ref: '${{ inputs.checkout-ref }}', token: '${{ secrets.CHECKOUT_TOKEN }}', path: '${{ inputs.checkout-path }}' }
      - name: Clone workspace repos
        if: inputs.clone-repos != ''
        run: |
          TOKEN=${{ secrets.CHECKOUT_TOKEN }}
          for rd in ${{ inputs.clone-repos }}; do
            r="${rd%%:*}"; d="${rd##*:}"
            [ ! -d "$d" ] && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${r}.git" "$d" || echo "WARN: failed to clone ${r} into ${d}"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '${{ inputs.checkout-path }}' }
      - name: Build release binaries
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATES="${{ inputs.release-binaries }}"
          [ -z "$CRATES" ] && CRATES="${{ inputs.target-crates }}"
          for c in $CRATES; do cargo build --release -p "$c"; done
      - uses: actions/upload-artifact@v7
        with: { name: 'macos-arm64-${{ inputs.target-name }}', path: '${{ inputs.checkout-path }}/target/release/', retention-days: 7 }

  release-windows:
    if: inputs.build-release
    needs: [windows, lint]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { repository: '${{ inputs.checkout-repo }}', ref: '${{ inputs.checkout-ref }}', token: '${{ secrets.CHECKOUT_TOKEN }}', path: '${{ inputs.checkout-path }}' }
      - name: Clone workspace repos
        if: inputs.clone-repos != ''
        shell: bash
        run: |
          TOKEN=${{ secrets.CHECKOUT_TOKEN }}
          for rd in ${{ inputs.clone-repos }}; do
            r="${rd%%:*}"; d="${rd##*:}"
            [ ! -d "$d" ] && git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${r}.git" "$d" || echo "WARN: failed to clone ${r} into ${d}"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '${{ inputs.checkout-path }}' }
      - name: Build release binaries
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATES="${{ inputs.release-binaries }}"
          [ -z "$CRATES" ] && CRATES="${{ inputs.target-crates }}"
          for c in $CRATES; do cargo build --release -p "$c"; done
      - uses: actions/upload-artifact@v7
        with: { name: 'windows-x86_64-${{ inputs.target-name }}', path: '${{ inputs.checkout-path }}/target/release/', retention-days: 7 }

  # ══════════════════════════════════════════════════════════════════
  # GATE — overall status (fails CI if any required job failed)
  # ══════════════════════════════════════════════════════════════════
  ci-complete:
    if: always()
    needs:
      - linux
      - macos
      - windows
      - check-wasm
      - lint
      - cargo-deny
      - security-audit
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== CI Results for ${{ inputs.target-name }} ==="
          echo "  Linux:   ${{ needs.linux.result }}"
          echo "  macOS:   ${{ needs.macos.result }}"
          echo "  Windows: ${{ needs.windows.result }}"
          echo "  WASM:    ${{ needs.check-wasm.result }}"
          echo "  Lint:    ${{ needs.lint.result }}"
          echo "  cargo-deny:     ${{ needs.cargo-deny.result }}"
          echo "  Security audit: ${{ needs.security-audit.result }}"

          [ "${{ needs.linux.result }}" = "failure" ] && echo "LINUX BUILD/TEST FAILED" && exit 1
          [ "${{ needs.macos.result }}" = "failure" ] && echo "MACOS BUILD/TEST FAILED" && exit 1
          [ "${{ needs.windows.result }}" = "failure" ] && echo "WINDOWS BUILD/TEST FAILED" && exit 1
          [ "${{ needs.check-wasm.result }}" = "failure" ] && echo "WASM BUILD FAILED" && exit 1
          [ "${{ needs.lint.result }}" = "failure" ] && echo "WARNING: Lint failed (non-blocking)"
          [ "${{ needs.cargo-deny.result }}" = "failure" ] && echo "WARNING: cargo-deny failed (non-blocking)"
          [ "${{ needs.security-audit.result }}" = "failure" ] && echo "WARNING: security audit failed (non-blocking)"

          echo ""
          echo "CI PASSED for ${{ inputs.target-name }}"
