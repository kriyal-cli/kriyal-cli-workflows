name: Reusable Build Pipeline

# Generic, product-agnostic build/test/lint/release pipeline for Rust
# workspaces spread across multiple sibling repos. Callers configure
# everything through inputs/secrets below - this file has no knowledge
# of any specific product, crate, or organization.
#
# Any product-specific gates (security scanning, policy enforcement,
# custom test suites, etc.) belong in a separate private workflow that
# your calling workflow chains after this one via `needs:` - keeping
# this file generic means it changes rarely and stays safe to keep
# public.

on:
  workflow_call:
    inputs:
      checkout-repo:
        description: 'owner/repo to check out as the base workspace'
        required: true
        type: string
      checkout-ref:
        description: 'Ref to check out for checkout-repo (defaults to its default branch)'
        required: false
        type: string
        default: ''
      checkout-path:
        description: 'Subdirectory (relative to the job workspace root) to check out checkout-repo into. Leave as "." for a workspace with no external path-dependencies (checkout goes to the workspace root, same as before). Set this when checkout-repo has crates that path-depend on sibling repos outside itself (e.g. "../../../other-repo/crates/x") - clone-repos entries then land as TRUE siblings of this directory, matching what those path-deps expect.'
        required: false
        type: string
        default: '.'
      clone-repos:
        description: 'Space-separated "owner/repo:localdir" pairs to shallow-clone as siblings of checkout-path (all cloned with the same checkout-token)'
        required: false
        type: string
        default: ''
      target-crates:
        description: 'Space-separated crate names to check/build/test'
        required: true
        type: string
      target-name:
        description: 'Human-readable name for this build target, used in job summaries and artifact names'
        required: true
        type: string
      run-tests:
        required: false
        type: boolean
        default: true
      build-release:
        required: false
        type: boolean
        default: false
      check-wasm:
        description: 'Check WASM target compilation'
        required: false
        type: boolean
        default: false
      release-binaries:
        description: 'Space-separated crate names to build release binaries for (defaults to target-crates)'
        required: false
        type: string
        default: ''
      run-security:
        description: 'Run generic dependency security scanning (cargo-deny licenses/bans/advisories + cargo-audit) - no product-specific crate names involved'
        required: false
        type: boolean
        default: true
      security-audit-ignore:
        description: 'Space-separated RUSTSEC advisory IDs to ignore in cargo-audit (e.g. RUSTSEC-2020-0071)'
        required: false
        type: string
        default: ''
      deny-toml-ref:
        description: 'Ref of kriyal-cli/kriyal-cli-workflows to fetch the shared default deny.toml from, used only when checkout-repo has no deny.toml of its own'
        required: false
        type: string
        default: 'v1'
      run-linux:
        description: 'Run a native Linux build+test job on ubuntu-latest (a GitHub-hosted runner, no self-hosted dependency). Runs FIRST; Windows is gated behind it (macOS removed 2026-08-29). Linux is 1x minutes and catches most genuine breaks, so Windows 2x minutes are only spent on a tree Linux already proved good.'
        required: false
        type: boolean
        default: false
      run-windows:
        description: 'Run the windows build+test job. Set false to skip Windows entirely (e.g. while a Windows-only toolchain gap - like a missing OPENSSL_DIR for a sqlite/openssl-linking crate - is unresolved) without blocking linux or anything gated on this workflow overall succeeding.'
        required: false
        type: boolean
        default: true
      linux-runner:
        description: 'JSON array of runner labels for the Linux jobs, e.g. ["ubuntu-latest"] or ["self-hosted","linux"]. Passed through from build-dispatch.yml, which gets it from gh-runner-dashboard chooseBuildRouting(). Default keeps the previous hosted behaviour for any caller that does not set it.'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      windows-runner:
        description: 'JSON array of runner labels for the Windows jobs. Same source and same defaulting as linux-runner.'
        required: false
        type: string
        default: '["windows-latest"]'
      concurrency-group:
        description: 'Concurrency group name - set the same value across callers that share a single-machine runner to serialize their builds'
        required: false
        type: string
        default: ''
    secrets:
      CHECKOUT_TOKEN:
        description: 'OPTIONAL. Token with read access to checkout-repo and every repo in clone-repos. Needed only on GitHub-HOSTED runners, which have no credentials of their own. On a self-hosted runner leave it unset: the checkout step below clones over SSH with the key that runner already holds, which is how claude-review.yml has always authenticated. Making this required meant central dispatch could not work at all until somebody minted a cross-org PAT.'
        required: false

concurrency:
  group: ${{ inputs.concurrency-group != '' && inputs.concurrency-group || format('reusable-build-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ==================================================================
  # PLATFORM PIPELINE - Linux first, Windows gated behind it.
  #
  # macOS was REMOVED (2026-08-29). It is not a supported CI platform for
  # this fleet any more: the only macOS runner has been deregistered, and
  # GitHub-hosted macOS bills at 10x the Linux rate, which on a Free
  # plan's shared minute pool is the most expensive thing in the matrix.
  # The macOS PROVISIONING scripts under macos/ in gh-runner-setup are
  # deliberately KEPT - a replacement Mac is expected - so restoring this
  # job later means re-adding it here, not rebuilding the tooling.
  #
  # ORDERING. Linux runs first and Windows is gated behind it, replacing
  # the old macOS->Windows chain. Linux is the cheapest platform (1x
  # minutes vs Windows' 2x) and the one most likely to catch a genuine
  # break, so Windows minutes are only spent on a tree Linux already
  # proved good - the fastest feedback and the cheapest failure.
  #
  # PR label escape hatch: a PR clearly scoped to one platform does not
  # need the other to run. Attach the label in the PR's Labels sidebar -
  # read from PR metadata, NOT the body or commit message.
  #   - `ci:windows-only` -> skip the Linux gate, run Windows only
  #   - `ci:linux-only`   -> run Linux only, skip Windows
  #   - `ci:all`          -> force every platform regardless
  # `ci:macos-only` is now INERT and is treated as no label at all, rather
  # than silently skipping everything - an old PR still carrying it must
  # not end up running nothing.
  # ==================================================================

  linux:
    name: 'linux (build + test)'
    if: inputs.run-linux
    runs-on: ${{ fromJSON(inputs.linux-runner) }}
    steps:
      # ── CHECKOUT WITHOUT A MANDATORY CROSS-ORG TOKEN ──────────────────
      #
      # This replaced `actions/checkout` + an `x-access-token` clone loop,
      # both of which required secrets.CHECKOUT_TOKEN. That secret never
      # existed, so central dispatch could not check out a private repo in
      # another org and no dispatched build could run at all.
      #
      # A self-hosted runner already holds a working SSH key - it is how
      # claude-review.yml authenticates - so on those runners no secret is
      # needed. When CHECKOUT_TOKEN *is* set (GitHub-hosted runners, which
      # carry no credentials of their own) the HTTPS form is used instead.
      # Same step either way, so the two paths cannot drift apart.
      - name: Check out the target workspace
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
          CO_REPO: ${{ inputs.checkout-repo }}
          CO_REF: ${{ inputs.checkout-ref }}
          CO_PATH: ${{ inputs.checkout-path }}
          CO_CLONES: ${{ inputs.clone-repos }}
        run: |
          set -euo pipefail

          # The destination is emptied before cloning, so a malformed value
          # here would erase the wrong tree. Absolute paths and traversal are
          # refused outright rather than normalised.
          case "$CO_PATH" in
            "" ) echo "::error::checkout-path is empty"; exit 1 ;;
            /* ) echo "::error::checkout-path must be relative, got '$CO_PATH'"; exit 1 ;;
            *..* ) echo "::error::checkout-path must not contain '..', got '$CO_PATH'"; exit 1 ;;
          esac

          url_for() {
            if [ -n "${CHECKOUT_TOKEN:-}" ]; then
              printf 'https://x-access-token:%s@github.com/%s.git' "$CHECKOUT_TOKEN" "$1"
            else
              printf 'git@github.com:%s.git' "$1"
            fi
          }

          # Mirrors actions/checkout: the destination starts empty every run,
          # so a build never inherits files from a previous one. Confined to
          # the job workspace by the guards above, which is the one tree the
          # runner is allowed to write (see gh-runner-setup clamp-deletes).
          fresh_clone() {
            repo="$1"; dest="$2"; ref="${3:-}"
            rm -rf -- "$dest"
            mkdir -p -- "$dest"
            if [ -n "$ref" ]; then
              git clone --depth 1 --branch "$ref" "$(url_for "$repo")" "$dest"
            else
              git clone --depth 1 "$(url_for "$repo")" "$dest"
            fi
          }

          if [ -n "${CHECKOUT_TOKEN:-}" ]; then
            echo "auth: CHECKOUT_TOKEN (https)"
          else
            echo "auth: ambient SSH key on this runner (no secret in play)"
          fi

          fresh_clone "$CO_REPO" "$CO_PATH" "$CO_REF"
          echo "checked out ${CO_REPO}${CO_REF:+@${CO_REF}} -> ${CO_PATH}"

          # Sibling repos the workspace path-depends on. A failure here is
          # fatal, unlike the previous loop which logged WARN and carried on
          # into a build that could only fail later, further from the cause.
          for rd in $CO_CLONES; do
            [ -n "$rd" ] || continue
            r="${rd%%:*}"; d="${rd##*:}"
            case "$d" in
              ""|/*|*..*) echo "::error::unsafe clone-repos destination '$d'"; exit 1 ;;
            esac
            fresh_clone "$r" "$d"
            echo "cloned sibling ${r} -> ${d}"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: platform-linux, workspaces: '${{ inputs.checkout-path }}' }
      - name: Cargo check
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo check $CRATE_FLAGS
      - name: Cargo test
        if: inputs.run-tests
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo test $CRATE_FLAGS --lib
          cargo test $CRATE_FLAGS --tests

  windows:
    name: 'windows (build + test)'
    needs: [linux]
    # always() so Windows still evaluates when linux was SKIPPED (e.g.
    # run-linux=false), while result != 'failure' keeps it from burning
    # 2x-rate minutes on a tree Linux already proved broken.
    if: ${{ always() && inputs.run-windows && needs.linux.result != 'failure' && (!contains(github.event.pull_request.labels.*.name, 'ci:linux-only') || contains(github.event.pull_request.labels.*.name, 'ci:all')) }}
    runs-on: ${{ fromJSON(inputs.windows-runner) }}
    steps:
      # ── CHECKOUT WITHOUT A MANDATORY CROSS-ORG TOKEN ──────────────────
