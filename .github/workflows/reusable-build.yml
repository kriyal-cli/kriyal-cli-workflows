        with: { prefix-key: 'rust-wasm', workspaces: '${{ inputs.checkout-path }}' }
      - name: Check wasm target
        working-directory: ${{ inputs.checkout-path }}
        run: for c in ${{ inputs.target-crates }}; do cargo check -p "$c" --target wasm32-unknown-unknown; done

  # ══════════════════════════════════════════════════════════════════
  # LINT — gated on the full platform chain, consistent with not
  # spending compute on anything beyond a commit that hasn't proven it
  # builds+tests yet.
  # ══════════════════════════════════════════════════════════════════
  lint:
    needs: [windows]
    if: always() && needs.windows.result != 'failure'
    runs-on: ${{ fromJSON(inputs.linux-runner) }}
    continue-on-error: true
    steps:
      # ── CHECKOUT WITHOUT A MANDATORY CROSS-ORG TOKEN ──────────────────
      #
      # This replaced `actions/checkout` + an `x-access-token` clone loop,
      # both of which required secrets.CHECKOUT_TOKEN. That secret never
      # existed, so central dispatch could not check out a private repo in
      # another org and no dispatched build could run at all.
      #
