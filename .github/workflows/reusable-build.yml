        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: '${{ inputs.checkout-path }}' }
      - name: Clippy
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo clippy $CRATE_FLAGS -- -W clippy::all
      - name: Fmt check
        working-directory: ${{ inputs.checkout-path }}
        run: cargo fmt --all -- --check

  # ══════════════════════════════════════════════════════════════════
  # SECURITY — generic dependency scanning (license/ban/advisory checks
  # via cargo-deny + cargo-audit). No product-specific crate names here
  # by design - a `cargo deny check` run doesn't need to know what your
  # crates are called, only what they depend on.
  # ══════════════════════════════════════════════════════════════════
  cargo-deny:
    if: inputs.run-security
    needs: [windows]
    runs-on: ${{ fromJSON(inputs.linux-runner) }}
    continue-on-error: true
    steps:
      # ── CHECKOUT WITHOUT A MANDATORY CROSS-ORG TOKEN ──────────────────
      #
      # This replaced `actions/checkout` + an `x-access-token` clone loop,
      # both of which required secrets.CHECKOUT_TOKEN. That secret never
      # existed, so central dispatch could not check out a private repo in
      # another org and no dispatched build could run at all.
