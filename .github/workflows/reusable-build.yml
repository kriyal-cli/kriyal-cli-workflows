              ""|/*|*..*) echo "::error::unsafe clone-repos destination '$d'"; exit 1 ;;
            esac
            fresh_clone "$r" "$d"
            echo "cloned sibling ${r} -> ${d}"
          done
      - name: Ensure deny.toml (fetch shared default if repo has none)
        working-directory: ${{ inputs.checkout-path }}
        run: |
          if [ -f deny.toml ]; then
            echo "Using repo-local deny.toml"
          else
            echo "No local deny.toml - fetching shared default (ref: ${{ inputs.deny-toml-ref }})"
            curl -fsSL -o deny.toml "https://raw.githubusercontent.com/kriyal-cli/kriyal-cli-workflows/${{ inputs.deny-toml-ref }}/deny.toml"
          fi
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check licenses
        working-directory: ${{ inputs.checkout-path }}
        run: cargo deny check licenses
      - name: Check advisories (vulnerabilities)
        working-directory: ${{ inputs.checkout-path }}
        run: cargo deny check advisories
      - name: Check bans
        working-directory: ${{ inputs.checkout-path }}
        run: cargo deny check bans

  security-audit:
    if: inputs.run-security
    needs: [windows]
    runs-on: ${{ fromJSON(inputs.linux-runner) }}
    continue-on-error: true
    steps:
      # ── CHECKOUT WITHOUT A MANDATORY CROSS-ORG TOKEN ──────────────────
      #
      # This replaced `actions/checkout` + an `x-access-token` clone loop,
      # both of which required secrets.CHECKOUT_TOKEN. That secret never
      # existed, so central dispatch could not check out a private repo in
      # another org and no dispatched build could run at all.
      #
      # A self-hosted runner already holds a working SSH key - it is how
      # claude-review.yml authenticates - so on those runners no secret is
      # needed. When CHECKOUT_TOKEN *is* set (GitHub-hosted runners, which
      # carry no credentials of their own) the HTTPS form is used instead.
      # Same step either way, so the two paths cannot drift apart.
      - name: Check out the target workspace
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
          CO_REPO: ${{ inputs.checkout-repo }}
          CO_REF: ${{ inputs.checkout-ref }}
          CO_PATH: ${{ inputs.checkout-path }}
          CO_CLONES: ${{ inputs.clone-repos }}
        run: |
          set -euo pipefail

          # The destination is emptied before cloning, so a malformed value
          # here would erase the wrong tree. Absolute paths and traversal are
          # refused outright rather than normalised.
          case "$CO_PATH" in
            "" ) echo "::error::checkout-path is empty"; exit 1 ;;
            /* ) echo "::error::checkout-path must be relative, got '$CO_PATH'"; exit 1 ;;
            *..* ) echo "::error::checkout-path must not contain '..', got '$CO_PATH'"; exit 1 ;;
          esac

          url_for() {
            if [ -n "${CHECKOUT_TOKEN:-}" ]; then
              printf 'https://x-access-token:%s@github.com/%s.git' "$CHECKOUT_TOKEN" "$1"
            else
              printf 'git@github.com:%s.git' "$1"
            fi
          }

          # Mirrors actions/checkout: the destination starts empty every run,
          # so a build never inherits files from a previous one. Confined to
          # the job workspace by the guards above, which is the one tree the
          # runner is allowed to write (see gh-runner-setup clamp-deletes).
