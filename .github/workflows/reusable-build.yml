              git clone --depth 1 --branch "$ref" "$(url_for "$repo")" "$dest"
            else
              git clone --depth 1 "$(url_for "$repo")" "$dest"
            fi
          }

          if [ -n "${CHECKOUT_TOKEN:-}" ]; then
            echo "auth: CHECKOUT_TOKEN (https)"
          else
            echo "auth: ambient SSH key on this runner (no secret in play)"
          fi

          fresh_clone "$CO_REPO" "$CO_PATH" "$CO_REF"
          echo "checked out ${CO_REPO}${CO_REF:+@${CO_REF}} -> ${CO_PATH}"

          # Sibling repos the workspace path-depends on. A failure here is
          # fatal, unlike the previous loop which logged WARN and carried on
          # into a build that could only fail later, further from the cause.
          for rd in $CO_CLONES; do
            [ -n "$rd" ] || continue
            r="${rd%%:*}"; d="${rd##*:}"
            case "$d" in
              ""|/*|*..*) echo "::error::unsafe clone-repos destination '$d'"; exit 1 ;;
            esac
            fresh_clone "$r" "$d"
            echo "cloned sibling ${r} -> ${d}"
          done
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Dependency audit
        working-directory: ${{ inputs.checkout-path }}
        run: |
          IGNORE_FLAGS=""
          for id in ${{ inputs.security-audit-ignore }}; do IGNORE_FLAGS="$IGNORE_FLAGS --ignore $id"; done
          cargo audit $IGNORE_FLAGS

