        with: { shared-key: platform-windows, workspaces: '${{ inputs.checkout-path }}' }
      - name: Cargo check
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo check $CRATE_FLAGS
      - name: Cargo test
        if: inputs.run-tests
        shell: bash
        working-directory: ${{ inputs.checkout-path }}
        run: |
          CRATE_FLAGS=""
          for c in ${{ inputs.target-crates }}; do CRATE_FLAGS="$CRATE_FLAGS -p $c"; done
          cargo test $CRATE_FLAGS --lib
          cargo test $CRATE_FLAGS --tests

  check-wasm:
    if: inputs.check-wasm
    runs-on: ${{ fromJSON(inputs.linux-runner) }}
    steps:
      # ── CHECKOUT WITHOUT A MANDATORY CROSS-ORG TOKEN ──────────────────
      #
      # This replaced `actions/checkout` + an `x-access-token` clone loop,
      # both of which required secrets.CHECKOUT_TOKEN. That secret never
      # existed, so central dispatch could not check out a private repo in
      # another org and no dispatched build could run at all.
      #
